name: Build Garmin Connect IQ

on:
  push:
    paths:
      - 'garmin-ciq/**'
      - '.github/workflows/garmin-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Garmin CIQ SDK 9.2.0
        run: |
          curl -sL "https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-9.2.0-2026-06-09-92a1605b2.zip" -o ciq-sdk.zip
          unzip -q ciq-sdk.zip -d /opt/ciq-sdk
          chmod +x /opt/ciq-sdk/bin/monkeyc
          echo "CIQ SDK listo: $(/opt/ciq-sdk/bin/monkeyc --version 2>&1 || true)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Garmin device definitions
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          pip install -q garminconnect requests
          python3 .github/scripts/download_devices.py
          echo "Devices disponibles: $(ls /opt/ciq-sdk/devices/ 2>/dev/null | wc -l)"

      - name: Generate developer key
        run: |
          openssl genrsa -out /tmp/developer_key.pem 4096 2>/dev/null
          echo "Developer key generada"

      - name: Compile ReadyDay widget
        run: |
          cd garmin-ciq
          /opt/ciq-sdk/bin/monkeyc \
            -f monkey.jungle \
            -o /tmp/ReadyDay.iq \
            -y /tmp/developer_key.pem \
            -e \
            -a /opt/ciq-sdk/bin/api.db \
            -b /opt/ciq-sdk/bin/api.mir \
            -u /opt/ciq-sdk/devices/devices.xml \
            --typecheck 1 \
            2>&1
          echo "Compilación completada: $(ls -lh /tmp/ReadyDay.iq)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadyDay-${{ github.sha }}
          path: /tmp/ReadyDay.iq
          retention-days: 30

      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/ReadyDay.iq
          name: ReadyDay ${{ github.ref_name }}
