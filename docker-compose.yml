services:
  readyday-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: readyday-api
    restart: unless-stopped
    env_file: .env
    volumes:
      - readyday-data:/app/data
    networks:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  web:
    external: true

volumes:
  readyday-data:
    driver: local
